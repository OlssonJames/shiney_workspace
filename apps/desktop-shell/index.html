<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Desktop</title>
<meta name="description" content="Desktop shell for the personal app suite — Notes, Habit Tracker, Day Planner, Project Ideas." />
<meta name="theme-color" content="#6366f1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%236366f1'/%3E%3Crect x='14' y='16' width='36' height='24' rx='2' fill='none' stroke='white' stroke-width='3'/%3E%3Cline x1='24' y1='48' x2='40' y2='48' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='32' y1='40' x2='32' y2='48' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="desktop" class="desktop"></div>

  <nav class="dock" id="dock"></nav>

  <div class="assistant" id="assistant">
    <div class="assistant-bubble" id="assistantBubble" hidden>
      <div class="assistant-bubble-heard" id="assistantHeard"></div>
      <div class="assistant-bubble-said" id="assistantSaid"></div>
    </div>
    <button class="assistant-orb" id="assistantOrb" title="Voice assistant — click and speak a command" aria-label="Voice assistant">
      <span class="orb-icon">🎙️</span>
    </button>
  </div>

  <script src="app.js"></script>
  <script src="assistant.js"></script>
</body>
</html>
