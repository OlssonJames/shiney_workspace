<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Session Notes</title>
<meta name="description" content="Dedicated progression notes for BJJ, coding, and side hustle." />
<meta name="theme-color" content="#6366f1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%236366f1'/%3E%3Cpath d='M20 20h24v4H20zM20 30h24v4H20zM20 40h16v4H20z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">📓</span>
      <span class="brand-name">Session Notes</span>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="header-actions">
      <button class="icon-btn labeled" id="syncBtn" title="Sync notes to Habit Tracker" aria-label="Sync to Tracker">🔄 <span class="btn-label">Sync</span></button>
      <button class="icon-btn labeled" id="importBtn" title="Import notes" aria-label="Import">⬆ <span class="btn-label">Import</span></button>
      <button class="icon-btn labeled" id="exportBtn" title="Export all notes" aria-label="Export">⬇ <span class="btn-label">Export</span></button>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <div id="modal-root"></div>
  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
